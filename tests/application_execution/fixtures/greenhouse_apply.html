<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Synthetic Greenhouse Apply</title>
</head>
<body>
  <h1>Software Engineer — Example Co</h1>
  <form id="application-form" action="/would-submit" method="post">
    <label for="first_name">First Name</label>
    <input id="first_name" name="job_application[first_name]" type="text" value="" />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="job_application[last_name]" type="text" value="" />

    <label for="email">Email</label>
    <input id="email" name="job_application[email]" type="email" value="preexisting@example.com" />

    <label for="phone">Phone</label>
    <input id="phone" name="job_application[phone]" type="text" value="" />

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="job_application[urls][linkedin]" type="text" value="" />

    <label for="resume">Resume</label>
    <input id="resume" name="job_application[resume]" type="file" />

    <label for="cover">Cover Letter</label>
    <input id="cover" name="job_application[cover_letter]" type="file" />

    <label for="auth">Are you legally authorized to work in the United States?</label>
    <select id="auth" name="job_application[work_auth]">
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <button type="submit" id="submit-app">Submit Application</button>
  </form>
</body>
</html>
