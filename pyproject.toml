[project]
name = "job-application-agent"
version = "0.1.0"
description = "Privacy-first, evidence-grounded job-application automation — Phase 1"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "python-dotenv>=1.0,<2",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "httpx>=0.27,<1",
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = 3.12
strict = true
explicit_package_bases = true
mypy_path = ["."]
exclude = "(^\\.venv/|^build/|^dist/|^\\.git/|.*/__pycache__/)"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
exclude = ["data*", "config*", "docs*", "tests*", ".github*"]
namespaces = false

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
