<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganesha Job Dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="site-header">
    <div class="header-text">
      <h1>Ganesha Job Dashboard</h1>
      <p class="subtitle">Local jobs with evidence-based fit bands. Generation lives on each job’s detail page. <a href="/likely-applied">Likely applied</a> · <a href="/answer-bank">Answer bank</a> · <a href="/review-queue">Review queue</a></p>
    </div>
    <div class="header-actions">
      <p class="result-count" id="result-count" aria-live="polite">Loading…</p>
      <button type="button" class="btn primary" id="refresh-jobs">Refresh jobs</button>
    </div>
  </header>

  <main>
    <section class="refresh-panel" id="refresh-panel" aria-live="polite">
      <p class="refresh-meta muted" id="refresh-meta">Checking last refresh…</p>
      <p class="stale-notice" id="stale-notice" hidden>Feed looks stale. Refresh to pull new listings.</p>
      <div class="refresh-progress" id="refresh-progress" hidden></div>
    </section>

    <form id="filters" class="filters" role="search" aria-label="Job filters">
      <div class="filter-field">
        <label for="fit">Fit view</label>
        <select id="fit" name="fit">
          <option value="recommended" selected>Recommended</option>
          <option value="recommended_stretch">Recommended + Stretch</option>
          <option value="needs_review">Needs review</option>
          <option value="low_fit">Low fit</option>
          <option value="all_eligible">All eligible</option>
          <option value="all">All stored jobs</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="recency">Recency</label>
        <select id="recency" name="recency">
          <option value="all" selected>All</option>
          <option value="24h">Last 24 hours</option>
          <option value="3d">Last 3 days</option>
          <option value="7d">Last 7 days</option>
          <option value="new_since_refresh">New since last refresh</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="q">Keyword</label>
        <input type="search" id="q" name="q" placeholder="Search title or company" autocomplete="off">
      </div>
      <div class="filter-field">
        <label for="source">Source</label>
        <select id="source" name="source">
          <option value="">All sources</option>
        </select>
      </div>
      <div class="filter-field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="Filter location" autocomplete="off">
      </div>
      <div class="filter-field">
        <label for="date_from">Date added from</label>
        <input type="date" id="date_from" name="date_from">
      </div>
      <div class="filter-field">
        <label for="date_to">Date added to</label>
        <input type="date" id="date_to" name="date_to">
      </div>
      <div class="filter-field">
        <label for="sort">Sort</label>
        <select id="sort" name="sort">
          <option value="date_desc">Newest added</option>
          <option value="date_asc">Oldest added</option>
          <option value="fit_desc">Fit score</option>
          <option value="title_asc">Title A–Z</option>
          <option value="title_desc">Title Z–A</option>
          <option value="company_asc">Company A–Z</option>
          <option value="company_desc">Company Z–A</option>
          <option value="location_asc">Location A–Z</option>
          <option value="location_desc">Location Z–A</option>
          <option value="source_asc">Source A–Z</option>
          <option value="source_desc">Source Z–A</option>
        </select>
      </div>
      <div class="filter-actions">
        <button type="submit" class="btn primary">Search</button>
        <button type="button" class="btn" id="clear-filters">Clear filters</button>
      </div>
    </form>

    <p id="fit-counts" class="fit-counts muted" aria-live="polite"></p>
    <p id="recency-counts" class="fit-counts muted" aria-live="polite"></p>
    <p id="status-message" class="status-message" hidden role="status"></p>

    <div class="table-wrap" id="results-wrap">
      <table class="jobs-table" aria-describedby="result-count">
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Company</th>
            <th scope="col">Fit</th>
            <th scope="col">Location</th>
            <th scope="col">Source</th>
            <th scope="col">Recency</th>
            <th scope="col">Details</th>
          </tr>
        </thead>
        <tbody id="jobs-body">
        </tbody>
      </table>
    </div>

    <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
      <button type="button" class="btn" id="prev-page">Previous</button>
      <p class="page-meta" id="page-meta"></p>
      <button type="button" class="btn" id="next-page">Next</button>
    </nav>
  </main>

  <script>
    window.GANESHA_DASHBOARD = {
      dbUnavailableMessage: {{ db_unavailable_message | tojson }},
      page: "jobs"
    };
  </script>
  <script src="/static/dashboard.js?v=refresh1"></script>
</body>
</html>
