<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job detail · Ganesha</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="site-header">
    <div class="header-text">
      <p class="breadcrumb"><a href="/">← Job feed</a></p>
      <h1 id="job-title">Loading…</h1>
      <p class="subtitle" id="job-company"></p>
    </div>
  </header>

  <main>
    <p id="status-message" class="status-message" hidden role="status"></p>

    <section class="detail-meta" id="detail-meta" hidden>
      <p><span class="muted">Location</span> <span id="job-location"></span></p>
      <p><span class="muted">Source</span> <span id="job-source"></span></p>
      <p><span class="muted">Posting</span> <span id="job-posting"></span></p>
      <p><span class="muted">Recommended track</span> <span id="job-track"></span></p>
      <p><span class="muted">Fit</span> <span id="job-fit"></span></p>
    </section>

    <section class="generation-controls" id="generation-controls">
      <h2>Generate documents</h2>
      <p class="muted" id="generation-eligibility-note"></p>
      <div class="generation-button-row">
        <button type="button" class="btn primary" id="btn-generate-resume">
          Generate tailored resume
        </button>
        <button type="button" class="btn primary" id="btn-generate-cover">
          Generate tailored cover letter
        </button>
      </div>
      <details class="cover-options" id="cover-options">
        <summary>Cover letter options</summary>
        <label class="actions-voice">
          Voice
          <select id="cover-voice">
            <option value="technical_direct" selected>Technical, direct</option>
            <option value="product_oriented">Product oriented</option>
            <option value="mission_oriented">Mission oriented</option>
            <option value="startup_fast_paced">Startup, fast paced</option>
            <option value="large_company_professional">Large company, professional</option>
          </select>
        </label>
        <button type="button" class="btn" id="btn-view-cover-plan">
          View cover-letter plan
        </button>
      </details>
      <p class="inline-warning" id="fit-generation-warning" hidden></p>
    </section>

    <section class="confirm-panel" id="confirm-panel" hidden>
      <h2 id="confirm-title">Confirm generation</h2>
      <ul class="confirm-list" id="confirm-list"></ul>
      <div class="confirm-actions">
        <button type="button" class="btn primary" id="confirm-generate">Generate</button>
        <button type="button" class="btn" id="cancel-generate">Cancel</button>
      </div>
    </section>

    <section class="result-panel" id="result-panel" hidden>
      <h2>Generation result</h2>
      <div id="result-body"></div>
    </section>

    <section class="result-panel" id="cover-plan-panel" hidden>
      <h2>Cover-letter plan</h2>
      <div id="cover-plan-body"></div>
    </section>

    <section class="result-panel" id="fit-breakdown-panel" hidden>
      <h2>Fit evidence</h2>
      <div id="fit-breakdown-body"></div>
    </section>

    <section class="description-block">
      <h2>Job description</h2>
      <p id="desc-warning" class="inline-warning" hidden></p>
      <pre id="job-description" class="job-description">Loading…</pre>
    </section>
  </main>

  <script>
    window.GANESHA_DASHBOARD = {
      dbUnavailableMessage: {{ db_unavailable_message | tojson }},
      jobId: {{ job_id | tojson }},
      page: "job_detail"
    };
  </script>
  <script src="/static/dashboard.js?v=fit1"></script>
</body>
</html>
