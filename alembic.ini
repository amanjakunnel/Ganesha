[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# sqlalchemy.url can be set here or provided via DATABASE_URL environment variable
# sqlalchemy.url = postgresql+psycopg://job_agent:change_me@localhost:5432/job_agent

[loggers]
keys = root,sqlalchemy,alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 0

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
